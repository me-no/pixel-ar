<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
  <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
  <script src="../dist/aframe-gif-shader.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
  <style>
    .msg-wrapper {
      position: absolute;
      top: 3%;
      left: 0;
      width: 90%;
      display: flex;
      flex-direction: column;
      padding: 32px 16px;
      color: #fff;
      text-shadow: 1px 1px 2px black;
    }
    
    .msg-wrapper p {
      margin: auto;
    }
    
    .marker-frame-wrapper {
      position: absolute;
      top: 25%;
      left: 0;
      right: 0;
      margin: auto;
      text-align: center;
    }
    
    .marker-frame-wrapper img {
      width: 80vw;
      opacity: 0.5;
    }
    /*
    .icons-wrapper {
      position: absolute;
      bottom: -8px;
      left: 20px;
      z-index: 10;
    }

    .icons-wrapper img {
      width: 60%;
      height: auto;
      max-width: 360px;
    }
    */

    .logo-wrapper {
      position: absolute;
      bottom: 8px;
      right: 8px;
      z-index: 10;
    }

    .logo-wrapper img {
      width: 40px;
      height: auto;
    }

    @media all and (orientation:landscape) {
      .marker-frame-wrapper {
        top: 15%;
      }

      .marker-frame-wrapper img {
        width: auto;
        height: 80vh;
      }
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene
    vr-mode-ui="enabled: false;"
    loading-screen="enabled: false;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;patternRatio:0.8;"
    id="scene"
    embedded
    gesture-detector
  >
    <a-marker
      type="pattern"
      preset="custom"
      url="assets/ratio08.patt"
      patternRatio="0.8"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;"
    ><!-- 富士山 -->
      <!-- Horizontal entity (flat on marker) -->
      <a-entity 
        geometry="primitive:plane;"
        rotation="-90 0 0"
        position="0 0 0"
        material="shader:gif;src:url(assets/mtfuji.gif);opacity:1;transparent: true"
        scale="1 1 1"
      ></a-entity>
      
      <!-- Vertical entity (standing up from marker) -->
      <a-entity 
        geometry="primitive:plane;"
        rotation="0 0 0"
        position="0 0.5 0"
        material="shader:gif;src:url(assets/bird.gif);opacity:1;transparent: true"
        scale="1 1 1"
      ></a-entity>
    </a-marker>

    <a-marker
        type="pattern"
        preset="custom"
        url="assets/mochi.patt"
        patternRatio="0.8"
        raycaster="objects: .clickable"
        emitevents="true"
        cursor="fuse: false; rayOrigin: mouse;"
    ><!-- 鏡餅 -->
      <!-- Horizontal entity (flat on marker) -->
      <a-entity 
        geometry="primitive:plane;"
        rotation="-90 0 0"
        position="0 0 0"
        material="src:url(assets/mochi_mat.png);opacity:1;"
        scale="1 1 1"
      ></a-entity>
      <a-entity 
        geometry="primitive:plane;"
        rotation="-90 0 0"
        position="0 0.5 0.1"
        material="shader:gif;src:url(assets/mochi.gif);opacity:1;transparent: true"
        scale="1 1 1"
      ></a-entity>
      <a-entity 
        geometry="primitive:plane;"
        rotation="-90 0 0"
        position="0 1 0.2"
        material="shader:gif;src:url(assets/mochi_orange.gif);opacity:1;transparent: true"
        scale="1 1 1"
      ></a-entity>
      
      <!-- Vertical entity (standing up from marker) -->
    </a-marker>

    <a-marker
      type="pattern"
      preset="custom"
      url="assets/pattern-horse.patt"
      patternRatio="0.8"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;"
      id="horse-marker"
    ><!-- 馬＠むれさん -->

      <!-- Horizontal entity (flat on marker) -->

      <!-- Vertical entity (standing up from marker) -->
      <a-entity
        geometry="primitive:plane;"
        rotation="-10 0 0"
        position="0 1 0"
        material="shader:gif;src:url(assets/horse.gif);opacity:1;transparent: true"
        scale="1 1 1"
      ></a-entity>
    </a-marker>

    <a-marker
      type="pattern"
      preset="custom"
      url="assets/pattern-wanko.patt"
      patternRatio="0.8"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;"
      id="horse-marker"
    ><!-- わんこ＠ガラさん -->

      <!-- Horizontal entity (flat on marker) -->

      <!-- Vertical entity (standing up from marker) -->
      <a-entity
        geometry="primitive:plane;"
        rotation="-10 0 0"
        position="0 1 0"
        material="shader:gif;src:url(assets/wanko.gif);opacity:1;transparent: true"
        scale="1.5 1.5 1.5"
      ></a-entity>
    </a-marker>

    <a-marker
      type="pattern"
      preset="custom"
      url="assets/pattern-running.patt"
      patternRatio="0.8"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;"
      id="horse-marker"
    ><!-- 走る子＠ガラさん -->

      <!-- Horizontal entity (flat on marker) -->

      <!-- Vertical entity (standing up from marker) -->
      <a-entity
        geometry="primitive:plane;"
        rotation="-10 0 0"
        position="0 1 0"
        material="shader:gif;src:url(assets/running.gif);opacity:1;transparent: true"
        scale="1 1 1"
      ></a-entity>
    </a-marker>

    <!-- 富士山以外: 251129追記 -->
    <a-marker
        type="pattern"
        preset="custom"
        url="assets/hanetsuki.patt"
        patternRatio=0.8
        raycaster="objects: .clickable"
        emitevents="true"
        cursor="fuse: false; rayOrigin: mouse;"
    >
        <a-entity 
            geometry="primitive:plane;" 
            rotation="-10 0 0"
            position="0.5 0 -2"
            material="shader:gif;src:url(assets/hanetsuki-resized.gif);opacity:1"
            scale="1.2 1.2 1.2"
            ></a-entity>
    </a-marker>
    <a-marker
        type="pattern"
        preset="custom"
        url="assets/koma.patt"
        patternRatio="0.8"
        raycaster="objects: .clickable"
        emitevents="true"
        cursor="fuse: false; rayOrigin: mouse;"
    ><!-- 駒（仮） -->
        <a-entity 
            geometry="primitive:plane;" 
            rotation="-90 0 0"
            position="0 1.2 0"
            material="shader:gif;src:url(assets/mochi.gif);opacity:1"></a-entity>
    </a-marker>


    <a-entity camera></a-entity>
  </a-scene>
  
  <div class="msg-wrapper">
    <p>マーカーを　カメラで　見てみよう</p>
  </div>
  
  <div class="marker-frame-wrapper" id="marker_frame_wrapper">
    <img src="../assets/marker-frame-08.png" />
  </div>

  <div class="icons-wrapper" style="display:none;">
    <img src="assets/fuyudo_icons_up.png" alt="Logo" />
  </div>

  <div class="logo-wrapper">
    <img src="assets/fuyudo_logo.png" alt="Logo" />
  </div>

  <script>
    $(document).ready(function() {
      setTimeout(function() {
        $('#marker_frame_wrapper').fadeOut('fast');
      }, 5000);
    });

    // Debug: Log when horse marker is found/lost
    AFRAME.registerComponent('markerhandler', {
      init: function() {
        const marker = this.el;

        marker.addEventListener('markerFound', function() {
          console.log('🐴 HORSE MARKER FOUND!');
          console.log('Marker element:', marker);
        });

        marker.addEventListener('markerLost', function() {
          console.log('❌ HORSE MARKER LOST');
        });
      }
    });

    // Attach the component after scene loads
    document.addEventListener('DOMContentLoaded', function() {
      const horseMarker = document.querySelector('#horse-marker');
      if (horseMarker) {
        horseMarker.setAttribute('markerhandler', '');
        console.log('✅ Debug script attached to horse marker');
      } else {
        console.error('⚠️ Could not find horse marker element');
      }
    });
  </script>
</body>
</html>
